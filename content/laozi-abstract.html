<p>本研究利用訓練BERT模型對四庫全書中老子其人的相關描述進行自動分類，並通過調用Deepseek等LLM模型進行信息生成幫助訓練，訓練後的模型平均準確率達0.9以上，在使用此模型對TXT格式的四庫全書進行分類後，獲得了老子其人描述的相關文本數據庫，并通過「吾與點」平臺進行智能標注。數據可為老子其人形象的演變與發展研究提供支持。</p>
